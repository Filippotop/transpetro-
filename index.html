<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Estudo interativo para a prova da Transpetro (Cesgranrio), Ênfase 8: Manutenção – Elétrica: estações por item do edital, fórmulas, questões e a Bancada de diagnóstico.">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Elétrica">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>window.__PWA=true;</script>
<title>Elétrica de Ouro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: um mapa de metrô do edital. Seis linhas (Eletricidade, Máquinas e Comandos, Instalações e Medidas, Automação e Eletrônica, Segurança e Normas, Matemática), cada estação um item. O dourado marca o que importa hoje. */
:root{
  --scale:1;
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#141A2E; --muted:#5A6079; --rule:#D7DBE6;
  --gold:#8F6300; --gold-soft:#F6E7C1; --gold-ink:#3D2A00;
  --h:#C33A33; --g:#1F7F55; --f:#3150C8; --s:#8A3BAE; --rd:#0E7C86;
  --ok:#1E7A4A; --ok-soft:#DDF1E5; --bad:#B3261E; --bad-soft:#F9DEDB; --warn:#A35F00; --warn-soft:#FCEBD0;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --on-color:#fff;
  --l:#B0306A;
  --e:var(--f); --m:var(--h); --i:var(--g); --a:var(--s); --n:var(--l); --x:var(--rd);
  --fs-1:12px; --fs-2:14px; --fs-3:16px; --fs-4:18px; --fs-5:22px; --fs-6:28px; --fs-7:36px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px;
  --r-sm:8px; --r-lg:14px; --shadow-1:0 1px 2px rgba(20,26,46,.06),0 2px 8px rgba(20,26,46,.05); --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2439; --ink:#E8EAF3; --muted:#9BA1BA; --rule:#2B3150;
  --gold:#E8B53E; --gold-soft:#3A2F12; --gold-ink:#F7E3B0;
  --h:#F2665E; --g:#3FBF85; --f:#7A93FF; --s:#C383EA; --rd:#3CC4CC;
  --ok:#4CC787; --ok-soft:#163626; --bad:#FF7A70; --bad-soft:#3E1A1A; --warn:#F2A640; --warn-soft:#3A2A10; --on-color:#0E1120; --l:#F27BB4;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2D; --sunk:#1F2439; --ink:#E8EAF3; --muted:#9BA1BA; --rule:#2B3150;
  --gold:#E8B53E; --gold-soft:#3A2F12; --gold-ink:#F7E3B0;
  --h:#F2665E; --g:#3FBF85; --f:#7A93FF; --s:#C383EA; --rd:#3CC4CC;
  --ok:#4CC787; --ok-soft:#163626; --bad:#FF7A70; --bad-soft:#3E1A1A; --warn:#F2A640; --warn-soft:#3A2A10; --on-color:#0E1120; --l:#F27BB4;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.brand .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--e) 0 16.7%,var(--m) 0 33.3%,var(--i) 0 50%,var(--a) 0 66.7%,var(--n) 0 83.3%,var(--x) 0);box-shadow:inset 0 0 0 5px var(--surface)}
.brand em{font-style:normal;color:var(--gold)}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;background:var(--gold-soft);color:var(--gold-ink);padding:5px 10px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--surface)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]:hover{color:var(--surface)}
main{padding-block:22px 80px}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* generic */
.btn{border:1px solid var(--rule);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.A{background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.lc-E{--lc:var(--e)} .lc-M{--lc:var(--m)} .lc-I{--lc:var(--i)} .lc-A{--lc:var(--a)} .lc-N{--lc:var(--n)} .lc-X{--lc:var(--x)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:22px;font-weight:800;letter-spacing:-.01em}

/* hero / mission */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--sp-5);align-items:start}
.side-home{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-3)}
.side-home .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.next{display:grid;gap:var(--sp-1);width:100%;text-align:left;cursor:pointer;border:0;border-radius:var(--r-lg);padding:var(--sp-5);margin:var(--sp-2) 0 var(--sp-4);background:var(--ink);color:var(--surface);box-shadow:var(--shadow-1)}
.next .eyebrow{color:var(--gold-soft)}
.next b{font-family:var(--display);font-size:var(--fs-5);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.next small{font-size:var(--fs-2);opacity:.85;line-height:1.4}
.next .cta{display:inline-flex;align-items:center;gap:var(--sp-1);margin-top:var(--sp-2);font-weight:700;color:var(--gold-soft)}
.task .ic svg{display:block}
.task .go{display:flex;color:var(--muted)}
.countdown{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4)}
.countdown .big{font-family:var(--display);font-size:var(--fs-7);font-weight:800;line-height:1;color:var(--gold)}
.countdown small{display:block;font-family:var(--mono);font-size:var(--fs-1);color:var(--muted)}
.countdown .warn-date{font-family:var(--display);font-size:var(--fs-1);line-height:1.35;margin-top:2px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);padding:var(--sp-4);text-align:center}
.aring{display:grid;justify-items:center;gap:2px;position:relative}
.aring b{position:absolute;top:20px;font-family:var(--mono);font-size:var(--fs-2)}
.aring span{font-size:var(--fs-1);color:var(--muted)}
.aring[data-area="ESP"]{--rg:var(--e)} .aring[data-area="MAT"]{--rg:var(--x)} .aring[data-area="CRD"]{--rg:var(--gold)}
.corte{display:grid;gap:2px;padding:var(--sp-3) var(--sp-4)}
.corte small{color:var(--muted);font-size:var(--fs-1);font-family:var(--mono)}
.hero>*{min-width:0}
.mission h2{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.mission p.lead{font-family:var(--read);font-size:16px;color:var(--muted);max-width:56ch;margin:8px 0 14px}
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.task:hover{border-color:var(--ink)}
.task .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--on-color);background:var(--lc,var(--gold))}
.task b{display:block;font-size:15px}
.task small{color:var(--muted);font-size:13px}
.task.done{background:var(--sunk);box-shadow:none}
.task.done .ic{opacity:.6}
.task .go{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.stat .n{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .bar2{height:5px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.stat .bar2 i{display:block;height:100%;background:var(--gold)}

/* metro */
.line{margin-bottom:14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 0 10px}
.line-head{display:flex;align-items:center;gap:10px;padding:0 16px 6px;flex-wrap:wrap}
.line-head .badge{width:28px;height:28px;border-radius:7px;background:var(--lc);color:var(--on-color);display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.line-head h3{font-size:17px;font-weight:800}
.line-head .pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.track{overflow-x:auto;padding:4px 16px 4px}
.stations{position:relative;display:flex;gap:0;min-width:max-content;padding-top:8px}
.stations::before{content:"";position:absolute;left:44px;right:44px;top:22px;height:6px;border-radius:3px;background:var(--lc);opacity:.9}
.st{position:relative;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0 2px 6px;text-align:center}
.st .c{width:26px;height:26px;border-radius:50%;background:var(--surface);border:5px solid var(--lc);position:relative;z-index:1;transition:transform .15s}
.st:hover .c{transform:scale(1.15)}
.st.part .c{background:linear-gradient(90deg,var(--lc) 50%,var(--surface) 50%)}
.st.done .c{background:var(--lc)}
.st.weak .c{box-shadow:0 0 0 3px var(--bad)}
.st.strong .c{box-shadow:0 0 0 3px var(--ok)}
.st .code{font-family:var(--mono);font-size:11px;font-weight:600}
.st .t{font-size:11.5px;line-height:1.2;color:var(--muted);max-width:84px}
.st.soon{cursor:default}
.st.soon .c{border-style:dashed;opacity:.6}
.st.soon .t{font-style:italic}
.st .fa{position:absolute;top:-4px;right:18px;z-index:2;font-family:var(--mono);font-size:9px;font-weight:600;background:var(--gold);color:var(--bg);border-radius:4px;padding:1px 4px}
.soon-line{margin:2px 16px 4px;font-family:var(--read);font-size:14px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;border:3px solid var(--muted);display:inline-block}

/* module */
.mod-head{border-left:6px solid var(--lc);padding:4px 0 4px 16px;margin-bottom:16px}
.mod-head h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.mod-head .note{font-family:var(--read);color:var(--muted);margin-top:6px;max-width:70ch}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:12px;font-family:var(--mono);font-size:12px}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);margin-bottom:18px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button[aria-current="true"]{color:var(--ink);border-color:var(--lc,var(--gold))}
.prose{font-family:var(--read);font-size:calc(17px*var(--scale));line-height:1.62;max-width:70ch}
.prose h4{font-family:var(--display);font-size:19px;font-weight:800;margin:28px 0 8px;letter-spacing:-.01em}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 14px}
.prose li{margin-bottom:6px}
.prose strong{font-weight:600}
.prose blockquote{margin:12px 0;padding:12px 16px;background:var(--sunk);border-radius:8px;font-size:calc(16px*var(--scale))}
.prose blockquote p{margin:0 0 4px}
.prose .src{font-size:13px;color:var(--muted);text-align:right;font-style:italic}
.callout{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:12px 16px;margin:14px 0;font-family:var(--display);font-size:15px;line-height:1.5}
.tw{overflow-x:auto;margin:12px 0 18px;max-width:100%}
table{border-collapse:collapse;font-family:var(--display);font-size:14px;line-height:1.4;min-width:100%}
th{background:var(--ink);color:var(--surface);text-align:left;padding:8px 10px;font-weight:600}
td{border-bottom:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.prose .tw{max-width:min(100%,900px)}
/* Quadros didáticos do conteúdo: Conceito, Exemplo, Como a banca cobra (.banca; .enem fica como sinônimo), Pegadinha, Conexão. */
.box{margin:var(--sp-4) 0;padding:var(--sp-3) var(--sp-4);border-left:4px solid var(--bx);background:var(--bx-bg);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--ink)}
.box-t{display:block;font-family:var(--display);font-size:var(--fs-1);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bx-t);margin-bottom:var(--sp-1)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.conceito{--bx:var(--f);--bx-bg:var(--sunk);--bx-t:var(--f)}
.box.exemplo{--bx:var(--g);--bx-bg:var(--ok-soft);--bx-t:var(--ok)}
.box.banca,.box.enem{--bx:var(--gold);--bx-bg:var(--gold-soft);--bx-t:var(--gold-ink)}
.box.pegadinha{--bx:var(--bad);--bx-bg:var(--bad-soft);--bx-t:var(--bad)}
.box.conexao{--bx:var(--s);--bx-bg:var(--sunk);--bx-t:var(--s)}
.toc-m{display:none}
.qview{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.72);display:grid;place-items:center;padding:var(--sp-4)}
.qv-in{background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-4);display:grid;gap:var(--sp-3);max-width:760px;width:100%;max-height:90vh;overflow:auto}
.qv-in img{width:100%;height:auto;border-radius:var(--r-sm);background:#fff}
.qv-in .muted{font-family:var(--mono)}
.tw.scrolls::before{content:'deslize a tabela para o lado →';display:block;position:sticky;left:0;font-family:var(--mono);font-size:var(--fs-1);color:var(--muted);padding-bottom:var(--sp-1)}
.toc-m summary{cursor:pointer;font-family:var(--display);font-size:var(--fs-2);font-weight:600;color:var(--muted);padding:var(--sp-2) 0}
.toc-m .toc{padding:var(--sp-1) 0 var(--sp-3)}
.layout2{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
.side{position:sticky;top:120px;display:grid;gap:10px}
.toc a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:4px 0;border-left:2px solid var(--rule);padding-left:10px}
.toc a:hover{color:var(--ink);border-color:var(--lc)}

/* resumo flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.flip{perspective:900px;border:0;background:none;padding:0;cursor:pointer;min-height:120px;text-align:left}
.flip .in{position:relative;height:100%;min-height:120px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa1,.flip .fa2{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.flip .fa1{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--lc)}
.flip .fa1 b{font-size:17px;font-weight:800}
.flip .fa2{background:var(--ink);color:var(--surface);transform:rotateY(180deg);font-family:var(--read);font-size:15.5px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}

/* question */
.q{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin-bottom:16px}
.q .qh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q .qh b{font-weight:800}
.q blockquote{font-family:var(--read);font-size:calc(16.5px*var(--scale));line-height:1.55;background:var(--sunk);margin:0 0 12px;padding:12px 16px;border-radius:8px}
.q blockquote p{margin:0 0 6px}
.q .qsrc{font-family:var(--read);font-size:12.5px;color:var(--muted);font-style:italic;margin:-4px 0 12px;text-align:right}
.q .cmd{font-family:var(--read);font-size:calc(17px*var(--scale));font-weight:600;margin:0 0 12px;line-height:1.45}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;font-family:var(--read);font-size:calc(16px*var(--scale));line-height:1.4}
.alt:hover:not(:disabled){border-color:var(--ink)}
.alt .L{font-family:var(--mono);font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:13px}
.alt:disabled{cursor:default}
.alt.picked{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.alt.right{border-color:var(--ok);background:var(--ok-soft)}
.alt.right .L{background:var(--ok);color:var(--on-color)}
.alt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.alt.wrong .L{background:var(--bad);color:var(--on-color)}
.alt.dim{opacity:.55}
.alt .old{font-family:var(--mono);font-size:10.5px;color:var(--bad);display:block;margin-top:4px}
.fb{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:14.5px}

/* arena */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.fc{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--lc)}

.res button{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;font-family:var(--read);font-size:15px;line-height:1.4}

.res mark{background:var(--gold-soft);color:var(--gold-ink);border-radius:3px;padding:0 2px}
.res small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:2px}
.orderopts{display:grid;gap:8px}
.orderopts button{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:12px;cursor:pointer;font-family:var(--read);font-size:16px}

.tools{display:flex;gap:6px;align-items:center}

.sbtn{display:none}

.pop{position:fixed;z-index:30;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.18);padding:16px;display:grid;gap:12px}

.simpill{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}

input[type=text],input[type=password],input[type=number],input[type=email],input:not([type]),select{width:100%;font:inherit;font-size:var(--fs-3);padding:var(--sp-3) var(--sp-3);border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}

}

/* ===== v4: refinamento visual + provas ===== */

.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}

.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
/* provas: aplicação */
.pvbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0}
.pvq{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pvclock{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:6px 14px;box-shadow:var(--shadow)}
.pvclock .mono{font-size:20px;font-weight:600}
.pvclock.late{border-color:var(--bad);color:var(--bad)}
.pvlayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.qimg{margin:0 0 14px;background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--rule);max-width:720px}
.qimg.wide{max-width:980px}
.qimg.shared{max-width:980px}
.qimg img{display:block;width:100%;height:auto}
.qimg figcaption{margin-bottom:8px;color:#5A6079}
.bubbles{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.bub{position:relative}
.bL{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);font-family:var(--mono);font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.bL:hover:not(:disabled){transform:scale(1.05)}
.bL.on{background:var(--ink);color:var(--surface)}
.bL.right{background:var(--ok);border-color:var(--ok);color:var(--on-color)}
.bL.wrong{background:var(--bad);border-color:var(--bad);color:var(--on-color)}
.bubbles.small .bL{width:40px;height:40px;font-size:15px;cursor:default}
.bx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center}
.bub.cut .bL{opacity:.3;text-decoration:line-through}
.bub.cut .bx{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pvside{position:sticky;top:90px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);max-height:calc(100vh - 110px);overflow:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}

.cell2 span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cell2 b{font-family:var(--mono);font-size:13px;min-height:15px}
.cell2.a{background:var(--ink);border-color:var(--ink)} .cell2.a span,.cell2.a b{color:var(--surface)}
.cell2.r{background:var(--ok-soft);border-color:var(--ok)} .cell2.r b{color:var(--ok)}
.cell2.w{background:var(--bad-soft);border-color:var(--bad)} .cell2.w b{color:var(--bad)}
.cell2.x{opacity:.45}
.cell2.f{box-shadow:inset 0 -3px 0 var(--warn)}
.cell2.cur{outline:2px solid var(--gold);outline-offset:1px}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{display:grid;gap:8px}
/* barra lateral no computador */
@media (min-width:1100px){
  body{padding-left:var(--side)}
  header.top{position:fixed;top:0;left:0;bottom:0;width:var(--side);border-bottom:0;border-right:1px solid var(--rule);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
  header.top>.wrap{display:flex;flex-direction:column;gap:14px;padding:24px 18px;max-width:none;min-height:100%}

  .toast,.simpill{left:calc(50% + var(--side)/2)}
}

<script>
const DATA = window.DATA;
/* Aprofundamentos (data/aprofundamento-*.js): teoria extra no fim do módulo e questões novas na contagem. */
function applyDeep(){ Object.entries(DATA.deep||{}).forEach(([id,d])=>{ const m=DATA.modules.find(x=>x.id===id); if(!m) return; if(d.html) m.html+=d.html; (d.questions||[]).forEach(q=>{ DATA.questions.push(q); m.qs.push(q.id); }); }); }
applyDeep();
const STUDY_LINES = ['E','M','I','A','N','X'];
/* Data do edital original (Anexo V). O app avisa para conferir a retificação no site da Cesgranrio. */
const EXAM = new Date('2026-11-29T08:00:00-03:00');
const EXAM_NOTE = 'data do edital original; confira a retificação no site da Cesgranrio';
const LINES = {E:{name:'Eletricidade',vol:'EL'},M:{name:'Máquinas e Comandos',vol:'EL'},I:{name:'Instalações e Medidas',vol:'EL'},A:{name:'Automação e Eletrônica',vol:'EL'},N:{name:'Segurança e Normas',vol:'EL'},X:{name:'Matemática',vol:'MT'}};
/* Blocos da prova: 40 específicas (vol EL) e 20 gerais, das quais 10 de Matemática (vol MT). Corte: 50% em cada bloco. */
const BLOCKS = {EL:{name:'Específicas',lines:['E','M','I','A','N']},MT:{name:'Matemática',lines:['X']}};
const TRAPS = {
  oposto:{name:'Termo oposto',tip:'A alternativa diz o contrário do que a lei ou o enunciado afirma (aumenta × diminui, série × paralelo). Troque pelo contrário e veja qual combina com a teoria.'},
  unidade:{name:'Unidade ou prefixo',tip:'A conta está certa, mas a unidade ou o prefixo não (mA × A, kW × W, kVA × kW). Confira as unidades antes de marcar.'},
  formula:{name:'Fórmula trocada',tip:'Usa uma fórmula parecida no lugar da certa (tensão de linha × de fase, √3 esquecido, potência aparente × ativa).'},
  detalhe:{name:'Detalhe verdadeiro',tip:'É verdade sobre o tema, mas não responde ao que o comando pergunta.'},
  exagero:{name:'Exagero',tip:'Vai além do que a norma ou a teoria garantem ("sempre", "nunca", "qualquer").'}
};
const Q = Object.fromEntries(DATA.questions.map(q=>[q.id,q]));
const M = Object.fromEntries(DATA.modules.map(m=>[m.id,m]));
const $ = (s,el=document)=>el.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const today = () => { const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); };
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); };
const pct = (a,b) => b? Math.round(100*a/b) : 0;
const plural = (n,um,varios) => `${n} ${n===1?um:varios}`;

/* ---------- state ---------- */
/* Progresso deste app. Fica separado do Humanas de Ouro (mesma origem github.io) e da Bancada (bancada-transpetro-v1). */
const KEY='eletrica-de-ouro-v1';
let S = {v:1, ans:{}, cards:{}, read:{}, best:{}, sims:[], recal:{}, vf:{}, notes:{}, plan:{}, rep:{}, marks:{}, chute:{}, redo:{}, snotes:{}, act:{}, pv:{}, updated:0};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function fix(){ ['vf','notes','plan','rep','recal','best','cards','read','ans','marks','chute','redo','snotes','act','pv','red'].forEach(k=>{ if(!S[k]||typeof S[k]!=='object') S[k]={}; }); if(!Array.isArray(S.sims)) S.sims=[]; }
fix();
let dbRef=null, saveTimer=null, saving=false, dirty=false;
/* Exclusões que a sincronização precisa respeitar (ver merge.js): t>0 apagado em t, t<0 recriado em -t. */
function markDel(path,gone){ S.del=S.del||{}; S.del[JSON.stringify(path.map(String))]=gone?Date.now():-Date.now(); }
function save(){
  S.updated=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200);
  if(window.onSaved) window.onSaved();
}
async function flush(){
  if(!dbRef||saving||!dirty) return;
  saving=true; dirty=false;
  try{ await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('salvo na sua conta'); }
  catch(e){ setSync('salvo neste aparelho'); }
  saving=false; if(dirty) flush();
}
function setSync(t){ $('#sync').textContent=t; }
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc('progresso/'+id);
    const snap=await dbRef.get();
    if(snap.exists){ const r=snap.data(); if(r && (r.updated||0)>(S.updated||0)){ S=Object.assign(S,r); fix(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} render(); } else if((S.updated||0)>(r.updated||0)){ dirty=true; flush(); } }
    else if(S.updated){ dirty=true; flush(); }
    setSync('salvo na sua conta');
  }catch(e){}
})();
let sample=null;
(async()=>{ try{ if(window.claude&&window.claude.use){ sample=await window.claude.use('sample'); document.body.classList.toggle('has-tutor',!!sample); } }catch(e){} })();

function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }

/* ---------- derived ---------- */
/* Questão de prova citada na teoria: abre a imagem ali mesmo; Esc ou o botão fecham. */
function openQView(ex,n){ const e=EX[ex]; if(!e||!e.img[n]) return; closeQView();
  const d=document.createElement('div'); d.className='qview'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label',`Questão ${n} da ${e.title}`);
  d.innerHTML=`<div class="qv-in"><div class="row" style="justify-content:space-between;align-items:center"><b>${e.title} · questão ${n}</b><button class="btn" id="qvClose">Fechar</button></div><img src="${imgUrl(ex,n)}" alt="Questão ${n} da ${e.title}" width="${e.img[n].w}" height="${e.img[n].h}"><details><summary class="muted" style="cursor:pointer">Resolva primeiro; depois toque para ver o gabarito</summary><p class="qv-key" style="margin:6px 0 0;font-family:var(--mono)">Gabarito oficial: <b>${e.key[n]||'anulada'}</b></p></details></div>`;
  d.onclick=ev=>{ if(ev.target===d) closeQView(); }; document.body.appendChild(d); $('#qvClose').onclick=closeQView; $('#qvClose').focus(); }
function closeQView(){ const d=document.querySelector('.qview'); if(d) d.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeQView(); });
/* Origem da questão: bloco da prova (específicas ou matemática) ou extra do app. */
function volLabel(q){ return q.kind==='extra'?'extra do app':q.vol==='MT'?'Matemática':'Específicas'; }
function modStats(mid){
  const m=M[mid]; let done=0, ok=0;
  m.qs.forEach(id=>{ const a=S.ans[id]; if(a){done++; if(a.ok) ok++;} });
  return {done, ok, n:m.qs.length, read:!!S.read[mid]};
}
function lineStats(L){
  let done=0,ok=0,n=0; DATA.modules.filter(m=>m.line===L&&!m.emBreve).forEach(m=>{const s=modStats(m.id); done+=s.done; ok+=s.ok; n+=s.n;});
  return {done,ok,n};
}
function volStats(vol){
  let done=0,ok=0; DATA.questions.filter(q=>q.vol===vol).forEach(q=>{const a=S.ans[q.id]; if(a){done++; if(a.ok) ok++;}});
  return {done,ok};
}
function dueCards(vol){ const t=today(); return DATA.cards.filter(c=>(!vol||c.vol===vol) && (!S.cards[c.id] || S.cards[c.id].due<=t)); }
function blockStats(vol){ return BLOCKS[vol].lines.map(lineStats).reduce((x,y)=>({done:x.done+y.done,ok:x.ok+y.ok,n:x.n+y.n}),{done:0,ok:0,n:0}); }
function modHtml(m){ return m.html; }
function examTarget(){ return EXAM; }
function daysLeft(){ const n=new Date(), t=examTarget(); const a=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()); const b=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()); return Math.max(0,Math.round((b-a)/86400000)); }
/* Prioridade da estação: faixa e peso do item na prova de 2023, mais o que você errou aqui. */
function priority(m){
  if(m.emBreve) return -99;
  const s=modStats(m.id); if(!s.n) return -99;
  let p={A:3,B:2,C:1}[m.faixa]||1;
  p+=Math.min(3,(m.peso2023||0)/3);
  if(s.done===s.n){ if(s.ok/s.n<0.67) p+=2.5; else p-=10; }
  if(s.read && s.done<s.n) p+=1;
  return p;
}
function nextModules(k){ return DATA.modules.slice().sort((a,b)=>priority(b)-priority(a)).filter(m=>priority(m)>-5).slice(0,k); }

/* ---------- router ---------- */
let view='linhas', param=null;
function go(v,p){ view=v; param=p||null; if(v==='mod'&&param){ lsSet('edo-last',{id:param.id,tab:param.tab||'teoria',t:Date.now()}); } closePop(); render(); window.scrollTo({top:0}); }
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(b.dataset.v);});
$('#brand').addEventListener('click',()=>go('linhas'));
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.v===view || (view==='mod'&&b.dataset.v==='linhas') || (view==='game'&&b.dataset.v==='arena') || ((view==='prova'||view==='provares'||view==='papel')&&b.dataset.v==='provas'))));
  if(view!=='prova' && typeof pvTimer!=='undefined') clearInterval(pvTimer);
  document.body.dataset.view=view;
  if(view!=='game') clearInterval(gameTimer);
  $('#readbar').hidden=true; updateGoal();
  const d=daysLeft(), dd=examTarget().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); $('#count').title='Prova: '+examTarget().toLocaleDateString('pt-BR')+' ('+EXAM_NOTE+')'; $('#count').innerHTML = d===1? `<span class="cl">falta </span>1 dia · ${dd}` : `<span class="cl">faltam </span>${d} dias · ${dd}`;

async function askTutor(out,prompt){
  if(!sample){ out.innerHTML='<p class="empty">O tutor não está disponível nesta visualização.</p>'; return; }
  out.innerHTML='<div class="tutor-out">Pensando…</div>'; const box=out.firstChild;
  try{ const r=await sample(prompt,{modelTier:'default',cache:false,onText:({text})=>{box.textContent=text;}}); box.textContent=r.text; }
  catch(e){ box.textContent = e&&e.code==='not_granted' ? 'Você não autorizou o tutor nesta página. Ele pode ser liberado no menu de permissões do artefato.' : e&&e.code==='rate_limited' ? 'Muitas perguntas seguidas. Espere um minuto e tente de novo.' : (e&&e.text) || 'Não consegui responder agora. Tente de novo em instantes.'; }
}

  function paint(){
    const reveal=st.locked;
    el.innerHTML=`<div class="q lc-${q.mod&&M[q.mod]?M[q.mod].line:(q.vol==='MT'?'X':'E')}">
      <div class="qh"><span><b>Questão ${q.n}</b> <span class="muted">· ${volLabel(q)}</span></span><span class="chip">${esc(q.tag)}</span></div>
      ${q.base.length?`<blockquote>${q.base.map(p=>`<p>${p}</p>`).join('')}</blockquote>`:''}
      ${q.src?`<div class="qsrc">(${q.src})</div>`:''}
      <p class="cmd">${q.cmd}</p>
      <div class="alts">${q.alts.map((a,i)=>{const k=L[i]; let c=''; if(reveal){ c = k===q.ans?'right':(st.tries.includes(k)?'wrong':'dim'); } else if(st.tries.includes(k)) c='wrong';
        return `<button class="alt ${c}" data-k="${k}" ${reveal||st.tries.includes(k)?'disabled':''}><span class="L">${k}</span><span>${a}</span></button>`}).join('')}</div>
      <div class="fbz"></div></div>`;
    const fbz=el.querySelector('.fbz');
    if(!reveal && st.tries.length===1){
      const k=st.tries[0], tr=q.traps[k];
      fbz.innerHTML = tr ? `<div class="fb trap"><strong>Armadilha: ${TRAPS[tr].name}.</strong> ${TRAPS[tr].tip} Você tem mais uma tentativa.</div>` : `<div class="fb no"><strong>Ainda não.</strong> Releia o comando, traduza o texto numa frase sua e tente de novo. Você tem mais uma tentativa.</div>`;
    }
    if(reveal){
      const first=st.tries[0]; const okFirst=first===q.ans;
      fbz.innerHTML=`<div class="fb ${okFirst?'ok':'no'}"><strong>${okFirst?'Certa de primeira.':(st.tries.includes(q.ans)?'Certa na segunda tentativa. Conta como erro na sua estatística.':'Gabarito: '+q.ans+'.')}</strong> ${okFirst?'':'Leia o porquê de cada alternativa.'}</div>
        <div class="ex">${L.split('').map(k=>`<div class="${k===q.ans?'c':''}"><span class="L">${k}</span><span>${q.ex[k]||''}${q.traps[k]?`<span class="tg">${TRAPS[q.traps[k]].name}</span>`:''}</span></div>`).join('')}</div>
        <div class="meta">Item ${esc(q.hab)} do edital · dificuldade ${esc(q.dif)}${prev&&opts.showPrev!==false?` · primeira resposta registrada: ${prev.first} (${prev.ok?'certa':'errada'})`:''}</div>
        <div class="qtools"><button class="chipbtn mk" aria-pressed="${!!S.marks[q.id]}">${S.marks[q.id]?'★ marcada para revisar':'☆ revisar depois'}</button>${S.ans[q.id]&&S.ans[q.id].ok?`<button class="chipbtn ch" aria-pressed="${!!S.chute[q.id]}">${S.chute[q.id]?'chute: vai para o caderno de erros':'acertei no chute'}</button>`:''}</div>
        <div class="row" style="margin-top:10px">${prev?'<button class="btn redo">Tentar de novo (não muda a estatística)</button>':''}<button class="btn tex tutor-only">Explique de outro jeito</button></div><div class="tx"></div>`;
      const mk=fbz.querySelector('.mk'); mk.onclick=()=>{ S.marks[q.id]=!S.marks[q.id]; if(!S.marks[q.id]) delete S.marks[q.id]; markDel(['marks',q.id],!S.marks[q.id]); save(); paint(); };
      const ch=fbz.querySelector('.ch'); if(ch) ch.onclick=()=>{ S.chute[q.id]=!S.chute[q.id]; if(!S.chute[q.id]) delete S.chute[q.id]; markDel(['chute',q.id],!S.chute[q.id]); save(); paint(); };
      const rd=fbz.querySelector('.redo'); if(rd) rd.onclick=()=>{ st.tries=[]; st.locked=false; paint(); };
      const tb=fbz.querySelector('.tex'); if(tb) tb.onclick=()=>askTutor(fbz.querySelector('.tx'),`Você é um tutor para a prova da Transpetro (Cesgranrio, Manutenção – Elétrica) falando com o estudante, em português do Brasil, texto simples sem markdown, até 150 palavras. Explique de um jeito diferente e mais concreto por que a alternativa ${q.ans} é a correta${first!==q.ans?` e por que a ${first}, que ele marcou, está errada`:''}. Confira as contas. Não invente fatos além do material.\n\nTexto-base: ${strip(q.base.join(' '))}\nFonte: ${strip(q.src)}\nComando: ${strip(q.cmd)}\nAlternativas: ${q.alts.map((a,i)=>L[i]+') '+strip(a)).join(' | ')}\nGabarito comentado: ${L.split('').map(k=>k+': '+strip(q.ex[k]||'')).join(' | ')}`);
    }
    el.querySelectorAll('.alt:not(:disabled)').forEach(b=>b.onclick=()=>pick(b.dataset.k));
  }
  function pick(k){
    st.tries.push(k);
    if(st.tries.length===1 && !S.ans[q.id]){ S.ans[q.id]={first:k,ok:k===q.ans,t:Date.now(),src:opts.src||'estudo',trap:k!==q.ans?(q.traps[k]||'conteudo'):null}; bump(); save(); }
    if(k===q.ans || st.tries.length>=2){ st.locked=true; opts.onDone&&opts.onDone(st.tries[0]===q.ans); }
    paint();
  }
  if(prev && opts.resume!==false){ st.tries=[prev.first]; if(prev.ok){st.locked=true;} else { st.tries=[prev.first]; } }
  if(prev && !prev.ok && opts.resume!==false){ st.locked=true; }
  paint();
}

/* ---------- ARENA ---------- */
const GAMES=[
  {g:'traps',t:'Detector de armadilhas',i:'alternativas erradas das questões',p:'Uma alternativa errada de verdade. Você diz qual armadilha ela usa: termo oposto, unidade ou prefixo, fórmula trocada, detalhe verdadeiro ou exagero.'},
  {g:'cards',t:'Cartões de véspera',i:`${DATA.cards.length} cartões · caixas de Leitner`,p:'Perguntas curtas de revisão. O que você erra volta hoje; o que acerta volta cada vez mais tarde.'},
  {g:'vf',t:'V ou F relâmpago',i:`${DATA.vf.length} afirmações · 8 segundos`,p:'Doze afirmações das estações. Sem tempo para enrolar: ou você sabe o conceito, ou não sabe.'}
];
function vArena(){
  app.innerHTML=`<div class="sec-title"><h2>Arena</h2><span class="eyebrow">jogos curtos para fixar conceito</span></div>
  ${GAMES.every(g=>g.g==='traps'?!DATA.questions.some(q=>Object.keys(q.traps||{}).length):g.g==='cards'?!DATA.cards.length:!DATA.vf.length)?'<p class="empty">Os jogos ganham conteúdo junto com as estações. Por enquanto há pouco para jogar.</p>':''}
  <div class="games">${GAMES.map(g=>`<button class="game" data-g="${g.g}"><span class="gi">${esc(g.i)}</span><h3>${esc(g.t)}</h3><p>${esc(g.p)}</p><span class="best">${g.g==='cards'?`${dueCards().length} vencidos hoje`:(S.best[g.g]!=null?`recorde: ${S.best[g.g]} pontos`:'sem recorde ainda')}</span></button>`).join('')}</div>`;
  app.querySelectorAll('.game').forEach(b=>b.onclick=()=>go('game',{g:b.dataset.g}));
  const ak=document.createElement('div'); ak.className='panel ankip'; const AK=ankiText(); const nAK=AK.split('\n').filter(l=>l&&l[0]!=='#').length;
  ak.innerHTML=`<div><div class="eyebrow">levar para o Anki</div><p style="font-family:var(--read);margin:6px 0 0">Os ${nAK} cartões do app (revisão de véspera e cartões-resumo das estações) num texto que o Anki importa direto: no Anki do computador, <b>Arquivo → Importar</b>, escolha o arquivo e confirme <b>Tabulação</b> como separador. Cada cartão vem com a etiqueta da estação.</p></div>
    <div class="row"><button class="btn" id="akCopy">Copiar os cartões</button>${window.__PWA?'<button class="btn" id="akFile">Salvar como arquivo .txt</button>':''}</div><textarea id="akTxt" hidden readonly style="min-height:90px;font-family:var(--mono);font-size:12px"></textarea><p class="muted" id="akSt" style="font-size:12.5px;margin:0" aria-live="polite"></p>`;
  app.appendChild(ak);

    try{ navigator.clipboard.writeText(AK).then(()=>{ $('#akSt').textContent='Copiado. Cole num arquivo de texto (.txt) e importe no Anki.'; },fb); }catch(e){ fb(); } };
  if($('#akFile')) $('#akFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([AK],{type:'text/plain'})); a.download='eletrica-de-ouro-anki.txt'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); $('#akSt').textContent='Arquivo salvo nos downloads.'; };

function ankiText(){
  const cl=s=>strip(String(s)).replace(/[\t\r\n]+/g,' ').trim(); const rows=[];
  DATA.cards.forEach(c=>rows.push([cl(c.q),cl(c.a),'eletrica-de-ouro véspera '+(c.vol||'')]));
  DATA.modules.forEach(m=>(m.resumo||[]).forEach(([k,v])=>rows.push([`${cl(k)} (${m.id} · ${cl(m.title)})`,cl(v),'eletrica-de-ouro '+m.id])));
  return '#separator:tab\n#html:false\n#tags column:3\n'+rows.map(r=>r.map(x=>x.replace(/\t/g,' ')).join('\t')).join('\n');
}
let gameTimer=null;
function vGame(){ clearInterval(gameTimer); const g={traps:gTraps,cards:gCards,vf:gVF}[param&&param.g]; if(g) g(); else go('arena'); }
function endGame(key,score,total,lines){
  clearInterval(gameTimer);
  const rec = S.best[key]==null || score>S.best[key]; if(rec){S.best[key]=score; save();}
  app.innerHTML=`<div class="stage"><button class="back" id="back">← Arena</button><div class="panel" style="text-align:center"><div class="eyebrow">${rec?'novo recorde':'resultado'}</div><div class="big">${score}</div><p class="muted">${esc(total)}</p></div>
    ${lines.length?`<div class="sec-title"><h2>Para revisar</h2></div><div class="tasks">${lines.map(l=>`<div class="panel" style="padding:12px 14px;font-family:var(--read)">${l}</div>`).join('')}</div>`:''}
    <div class="row" style="margin-top:16px"><button class="btn primary" id="again">Jogar de novo</button><button class="btn" id="ar">Voltar à Arena</button></div></div>`;
  $('#back').onclick=$('#ar').onclick=()=>go('arena'); $('#again').onclick=()=>vGame();
}
function runRounds({key,rounds,secs,renderRound}){
  let i=0,score=0,hits=0,streak=0; const miss=[];
  function next(){
    if(i>=rounds.length) return endGame(key,score,`${hits} de ${rounds.length} certas`,miss);
    const r=rounds[i]; let left=secs*10; let answered=false;
    app.innerHTML=`<div class="stage"><button class="back" id="back">← Arena</button><div class="score"><span>rodada ${i+1}/${rounds.length}</span><span>sequência ${streak}</span><span>${score} pts</span></div>${secs?'<div class="timer"><i id="ti"></i></div>':'<div style="height:16px"></div>'}<div id="rd"></div></div>`;
    $('#back').onclick=()=>{clearInterval(gameTimer);go('arena');};
    const finish=(ok,missLine)=>{ if(answered) return; answered=true; clearInterval(gameTimer);
      bump(); if(ok){ hits++; streak++; score+= 100 + Math.round(left/ (secs||1)) + (streak>=3?25:0); } else { streak=0; if(missLine) miss.push(missLine); }
      const nb=document.createElement('div'); nb.className='row'; nb.style.marginTop='14px'; nb.innerHTML='<button class="btn primary" id="nx">Próxima →</button>'; $('#rd').appendChild(nb); $('#nx').focus(); $('#nx').onclick=()=>{i++;next();}; };
    renderRound($('#rd'),r,finish);
    if(secs){ gameTimer=setInterval(()=>{ left--; const ti=$('#ti'); if(ti) ti.style.width=(left/(secs*10)*100)+'%'; if(left<=0){ clearInterval(gameTimer); const el=$('#rd'); el.querySelectorAll('button.opt').forEach(b=>{b.disabled=true; if(b.dataset.ok==='1') b.classList.add('right');}); finish(false,r.missLine); } },100); }
  }
  next();
}
function optsHTML(list){ return `<div class="opts">${list.map(o=>`<button class="opt" data-ok="${o.ok?1:0}">${o.label}</button>`).join('')}</div>`; }
function bindOpts(el,finish,missLine,after){
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ el.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.ok==='1') x.classList.add('right');}); const ok=b.dataset.ok==='1'; if(!ok) b.classList.add('wrong'); if(after) after(ok); finish(ok,missLine); });
}
function gTraps(){
  const pool=[]; DATA.questions.forEach(q=>Object.entries(q.traps).forEach(([k,t])=>pool.push({q,k,t})));
  const items=shuffle(pool).slice(0,10);
  if(!items.length){ app.innerHTML='<div class="stage"><button class="back" id="back">← Arena</button><p class="empty">Ainda não há alternativas com armadilha marcada. Elas chegam com o banco de questões.</p></div>'; $('#back').onclick=()=>go('arena'); return; }
  runRounds({key:'traps',secs:0,rounds:items.map(it=>({it,missLine:`Questão ${it.q.n} (${volLabel(it.q)}), alternativa ${it.k}: <strong>${TRAPS[it.t].name}</strong>. ${it.q.ex[it.k]}`})),
    renderRound(el,r,finish){ const q=r.it.q;
      el.innerHTML=`<div class="prompt" style="font-size:17px"><span class="k">questão ${q.n} · ${volLabel(q)}</span>${q.base.length?`<details style="margin-bottom:10px"><summary class="muted" style="cursor:pointer;font-size:14px">ver o texto-base</summary><div style="margin-top:8px;font-size:15.5px">${q.base.join('<br>')}</div></details>`:''}<div style="font-weight:600;margin-bottom:10px">${q.cmd}</div><div style="background:var(--bad-soft);border-radius:8px;padding:10px 12px"><span class="mono" style="font-weight:600">${r.it.k})</span> ${q.alts['ABCDE'.indexOf(r.it.k)]}</div><div class="muted" style="font-size:14px;margin-top:10px">Essa alternativa está errada. Que armadilha ela usa?</div></div>
        ${optsHTML(Object.entries(TRAPS).map(([k,v])=>({label:v.name,ok:k===r.it.t})))}`;
      bindOpts(el,finish,r.missLine,()=>{ const p=document.createElement('div'); p.className='fb trap'; p.innerHTML=`<strong>${TRAPS[r.it.t].name}.</strong> ${q.ex[r.it.k]}`; el.appendChild(p); }); }});
}
function gCards(){
  let filter=param.vol||null;
  const queue=shuffle(dueCards(filter)).slice(0,15); let i=0, right=0;
  const INT=[0,1,2,4,7,12];
  function show(){
    if(!queue.length || i>=queue.length){
      app.innerHTML=`<div class="stage"><button class="back" id="back">← Arena</button><div class="panel" style="text-align:center"><div class="eyebrow">sessão concluída</div><div class="big">${right}/${queue.length||0}</div><p class="muted">${queue.length?'Os que você errou já estão de volta para hoje.':DATA.cards.length?'Nenhum cartão vencido. Volte amanhã ou revise um bloco inteiro.':'Os cartões de véspera chegam junto com as estações.'}</p>${DATA.cards.length?'<div class="row" style="justify-content:center"><button class="btn" id="v1">Revisar as específicas</button><button class="btn" id="v2">Revisar Matemática</button></div>':''}</div></div>`;
      $('#back').onclick=()=>go('arena');
      if($('#v1')) $('#v1').onclick=()=>{ param.vol='EL'; forceAll('EL'); };
      if($('#v2')) $('#v2').onclick=()=>{ param.vol='MT'; forceAll('MT'); };
      return;
    }
    const c=queue[i]; const box=(S.cards[c.id]||{box:0}).box;
    app.innerHTML=`<div class="stage"><button class="back" id="back">← Arena</button><div class="score"><span>cartão ${i+1}/${queue.length}</span><span>${c.vol==='MT'?'Matemática':'Específicas'}</span><span>caixa ${box}</span></div><div style="height:12px"></div>
      <button class="prompt card3" id="cd" style="width:100%"><span class="k">responda em voz alta, depois toque</span><span style="font-size:22px;font-weight:600">${c.q}</span><span class="ans" id="ans" hidden>${c.a}</span></button>
      <div class="row" id="rate" hidden style="justify-content:center"><button class="btn" id="no">Não sabia</button><button class="btn primary" id="yes">Sabia</button></div></div>`;
    $('#back').onclick=()=>go('arena');
    $('#cd').onclick=()=>{ $('#ans').hidden=false; $('#rate').hidden=false; $('#yes').focus(); };
    $('#yes').onclick=()=>{ const b=Math.min(5,box+1); S.cards[c.id]={box:b,due:addDays(INT[b])}; right++; bump(); save(); i++; show(); };
    $('#no').onclick=()=>{ S.cards[c.id]={box:0,due:today()}; bump(); save(); queue.push(c); i++; show(); };
  }
  function forceAll(vol){ queue.length=0; shuffle(DATA.cards.filter(c=>c.vol===vol)).slice(0,20).forEach(c=>queue.push(c)); i=0; right=0; show(); }
  show();
}

          return `<button class="alt ${c}" data-k="${k}" ${st.pick?'disabled':''}><span class="L">${k}</span><span>${a}${k===r.his?'<span class="old">sua marcação na prova</span>':''}</span></button>`}).join('')}</div>

        z.querySelector('.rf').onclick=e=>{ e.target.remove(); questionCard(z.querySelector('.rfq'),Q[r.reforco],{src:'reforco'}); };
      }
      d.querySelectorAll('.alt:not(:disabled)').forEach(b=>b.onclick=()=>{ st.pick=b.dataset.k; S.recal[key]={ok:st.pick===r.ans,t:Date.now()}; save(); paint(); });
    };

    <div class="row" style="margin-top:18px"><button class="btn gold" id="start">Começar</button><span class="muted" id="avail"></span></div>
  </div>
  ${S.sims.length?`<div class="sec-title"><h2>Simulados anteriores</h2></div><div class="bars">${S.sims.slice(-6).reverse().map(s=>`<div class="brow"><span class="mono" style="font-size:12px">${new Date(s.t).toLocaleDateString('pt-BR')} · ${s.n}q</span><span class="track2"><i style="width:${pct(s.ok,s.n)}%"></i></span><span class="mono">${pct(s.ok,s.n)}%</span></div>`).join('')}</div>`:''}`;
  const pool=()=>{ let p=DATA.questions.slice();
    if(cfg.foco==='EL'||cfg.foco==='MT') p=p.filter(q=>q.vol===cfg.foco);
    if(cfg.foco==='novas') p=p.filter(q=>!S.ans[q.id]);
    if(cfg.foco==='fracos'){ const weak=new Set(DATA.modules.filter(m=>{const s=modStats(m.id); return s.done===0? m.faixa==='A' : s.ok/s.done<0.67;}).map(m=>m.id)); p=p.filter(q=>weak.has(q.mod) || (q.kind!=='fixacao' && (!S.ans[q.id]||!S.ans[q.id].ok))); }
    return p; };
  const upd=()=>{ $('#avail').textContent=`${plural(pool().length,'questão disponível','questões disponíveis')} nesse foco`; };
  $('#cn').onclick=e=>{const b=e.target.closest('button'); if(!b) return; cfg.n=+b.dataset.n; S.simcfg=cfg; vSim();};
  $('#cf').onclick=e=>{const b=e.target.closest('button'); if(!b) return; cfg.foco=b.dataset.f; S.simcfg=cfg; vSim();};
  upd();
  $('#start').onclick=()=>{ const p=pool(); if(!p.length){toast('Nenhuma questão nesse foco. Escolha outro.');return;}
    /* Proporção da prova de 2023: 40 específicas para 10 de Matemática (Português fica fora do app). */

function simFinish(){

  host().querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{param.f=b.dataset.f; vErros();});

function planToday(){ return DATA.plan.find(p=>p.d===isoToday()); }
function taskDone(p,i){ const t=p.tasks[i]; if(t.k==='mod'&&M[t.a]){ const s=modStats(t.a); if(s.done===s.n) return true; } if(t.k==='prova'&&EX[(t.a||'').split(':')[0]]){ const [ex,ar]=t.a.split(':'); const ds=allRuns(ex).filter(runReal).map(r=>r.areas).join(''); if(ar.split('').every(a=>ds.includes(a))) return true; } return !!S.plan[p.d+'|'+i]; }
function planDone(p){ let d=0; p.tasks.forEach((t,i)=>{ if(taskDone(p,i)) d++; }); return {done:d,n:p.tasks.length}; }
function taskLabel(t){ if(t.k==='mod'){ const m=M[t.a]; return `${m.id} · ${m.title} <span class="muted">(teoria, cartões, V ou F e ${m.qs.length} questões)</span>`; } return esc(t.t); }
function taskGo(t){
  if(t.k==='mod') return ()=>go('mod',{id:t.a,tab:S.read[t.a]?'q':'teoria'});
  if(t.k==='game') return ()=>go('game',{g:t.a});
  if(t.k==='sim') return ()=>{ SIM=null; go('treino',{s:'sim',foco:t.a,n:/30/.test(t.t)?30:20}); };
  if(t.k==='recal') return ()=>go('treino',{s:'recal'});
  if(t.k==='erros') return ()=>go('treino',{s:'erros'});
  if(t.k==='bib') return ()=>go('biblioteca',{s:t.a});
  if(t.k==='painel') return ()=>go('painel');
  if(t.k==='prova') return ()=>go('provas');
  if(t.k==='provares') return ()=>{ const ex=t.a; go(allRuns(ex).some(r=>r.done)?'provares':'provas',{id:ex}); };
  if(t.k==='refazer') return ()=>go('treino',{s:'refazer'});
  if(t.k==='bancada') return ()=>go('bancada');
  return null;
}

let IDX=null;
function buildIndex(){
  IDX=[];
  DATA.modules.filter(m=>!m.emBreve).forEach(m=>{ const d=document.createElement('div'); d.innerHTML=modHtml(m); let sec='Introdução'; let buf='';
    const push=()=>{ if(buf.trim()) IDX.push({g:'Teoria',t:`${m.id} · ${sec}`,txt:buf,act:()=>go('mod',{id:m.id,tab:'teoria'})}); buf=''; };
    [...d.children].forEach(c=>{ if(c.tagName==='H4'){ push(); sec=c.textContent; } else buf+=' '+c.textContent; }); push();
    m.resumo.forEach(r=>IDX.push({g:'Glossário',t:strip(r[0]),txt:strip(r[1]),act:()=>go('biblioteca',{s:'glos',q:strip(r[0])})}));
  });
  DATA.questions.forEach(q=>IDX.push({g:'Questões',t:`Questão ${q.n} · ${q.mod||(q.kind==='simulado'?'simulado':'reforço')}`,txt:strip(q.base.join(' ')+' '+q.cmd),act:()=> q.mod&&M[q.mod]? go('mod',{id:q.mod,tab:'q'}) : go('treino',{s:'sim'})}));
  DATA.vf.forEach(v=>IDX.push({g:'V ou F',t:`Estação ${v.mod}`,txt:strip(v.s),act:()=>go('mod',{id:v.mod,tab:'vf'})}));
  IDX.forEach(x=>x.n=norm(x.t+' '+x.txt));
}
function snippet(txt,qn){ const n=norm(txt); const i=n.indexOf(qn); if(i<0) return esc(txt.slice(0,160)); const a=Math.max(0,i-60), b=Math.min(txt.length,i+qn.length+100);
  return (a?'…':'')+esc(txt.slice(a,i))+'<mark>'+esc(txt.slice(i,i+qn.length))+'</mark>'+esc(txt.slice(i+qn.length,b))+(b<txt.length?'…':''); }
function vBusca(){
  if(!IDX) buildIndex();
  const q=(param&&param.q)||''; const qn=norm(q.trim()); $('#sq').value=q;
  const terms=qn.split(/\s+/).filter(Boolean);
  const hits=terms.length? IDX.filter(x=>terms.every(t=>x.n.includes(t))) : [];
  const groups={}; hits.forEach(h=>{ (groups[h.g]=groups[h.g]||[]).push(h); });
  const order=['Teoria','Glossário','V ou F','Questões'];
  app.innerHTML=`<div class="sec-title"><h2>Busca: “${esc(q)}”</h2><span class="eyebrow">${hits.length} resultados</span></div>
    ${hits.length?order.filter(g=>groups[g]).map(g=>`<div class="sec-title" style="margin-top:18px"><h2 style="font-size:17px">${g}</h2><span class="eyebrow">${groups[g].length}</span></div><div class="res">${groups[g].slice(0,12).map((h,i)=>`<button data-g="${g}" data-i="${i}"><small>${esc(h.t)}</small>${snippet(h.txt.trim(),terms[0])}</button>`).join('')}</div>`).join('')
    :`<p class="empty">Nada encontrado. Tente uma palavra só, sem acento ou no singular (ex.: "ohm", "fator", "contator").</p>`}`;
  app.querySelectorAll('.res button').forEach(b=>b.onclick=()=>groups[b.dataset.g][+b.dataset.i].act());
}

function lastDays(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); } return out; }
function dayStreak(){ const ds=lastDays(60).reverse(); let i=0; if(!(S.act[ds[0]]>0)) i=1; let n=0; for(;i<ds.length;i++){ if(S.act[ds[i]]>0) n++; else break; } return n; }

const APP_URL='https://filippotop.github.io/transpetro-/';
async function packS(){ const json=JSON.stringify(S); try{ const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw')); const buf=new Uint8Array(await new Response(cs).arrayBuffer()); let s=''; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return 'EDO1.'+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }catch(e){ return json; } }
async function unpackS(txt){ txt=String(txt).trim(); const m=txt.match(/EDO1\.([A-Za-z0-9_-]+)/); let o;
  if(m){ let b=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)); const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); o=JSON.parse(await new Response(ds).text()); }
  else o=JSON.parse(txt);
  const r=o&&o.S?o.S:o; if(!r||typeof r!=='object'||!r.ans) throw new Error('formato'); return r; }
function countRec(r){ return Object.keys(r.ans||{}).length+Object.values(r.pv||{}).reduce((a,p)=>a+(p.runs||[]).length,0); }
function popSync(){
  const p=$('#pop'); const n=countRec(S); let code=null;
  p.innerHTML=`${window.__PWA?'<div id="gistBox"></div>':''}<h3>Levar o progresso para outro lugar</h3>
    <p class="muted" style="font-size:13px;margin:0">${window.__PWA?'Para mandar o progresso deste app para o app dentro do Claude: copie aqui e cole lá, no mesmo menu.':'O jeito mais rápido: o botão abaixo abre o app instalado já trazendo este progresso. Ou copie o código e cole no outro app, no mesmo menu.'} Importar substitui o progresso de onde você colar.</p>
    ${window.__PWA?'':`<a class="btn gold" id="spApp" href="${APP_URL}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Abrir o app instalado com este progresso</a>`}
    <div class="row"><button class="btn ${window.__PWA?'gold':''}" id="spCopy" disabled>Copiar código do progresso</button>${window.__PWA?'<button class="btn" id="spFile">Salvar em arquivo</button>':''}</div>
    <textarea id="spTxt" placeholder="Cole aqui o código copiado do outro app" style="min-height:80px;font-family:var(--mono);font-size:12px"></textarea>
    <div class="row"><button class="btn" id="spImp">Importar o que colei</button>${window.__PWA?'<label class="btn" style="cursor:pointer">Abrir arquivo<input type="file" id="spIn" accept=".json,.txt,application/json,text/plain" hidden></label>':''}<button class="btn" id="pc">Fechar</button></div>
    <p class="muted" id="spSt" style="font-size:12.5px;margin:0" aria-live="polite">Preparando o código…</p>`;
  const st=$('#spSt');
  if(window.GistSync&&$('#gistBox')) GistSync.mountUI($('#gistBox'));
  packS().then(c=>{ code=c; $('#spCopy').disabled=false; st.textContent=`${n} registros de questões e provas · código de ${Math.max(1,Math.round(c.length/1024))} KB`; const a=$('#spApp'); if(a) a.href=APP_URL+'#importar='+encodeURIComponent(c); });
  $('#spCopy').onclick=()=>{ if(!code) return; const fb=()=>{ const ta=$('#spTxt'); ta.value=code; ta.focus(); ta.select(); st.textContent='Não consegui copiar sozinho: o código está selecionado na caixa, copie manualmente.'; };
    try{ navigator.clipboard.writeText(code).then(()=>{ st.textContent='Código copiado. Agora cole no outro app, em Aa → Copiar ou importar progresso.'; },fb); }catch(e){ fb(); } };
  if($('#spFile')) $('#spFile').onclick=()=>{ if(!code) return; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download='eletrica-de-ouro-progresso-'+isoToday()+'.txt'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); st.textContent='Arquivo salvo nos downloads.'; };

function pomoStart(focus,pause,phase='foco'){

const AREAS = {P:{name:'Português',a:1,b:10},M:{name:'Matemática',a:11,b:20},E:{name:'Conhecimentos Específicos',a:21,b:60}};
const FULL_AREAS = 'PME';
const imgUrl = (ex,n) => `provas/${ex}/${EX[ex].img[n].f}`;
function pvState(ex){ S.pv=S.pv||{}; S.pv[ex]=S.pv[ex]||{runs:[],notes:{}}; return S.pv[ex]; }
function areaNums(areas){ const out=[]; areas.split('').forEach(a=>{ for(let n=AREAS[a].a;n<=AREAS[a].b;n++) out.push(n); }); return out; }
function examAreas(ex){ return FULL_AREAS; }
/* 4 h para as 60 questões: 4 minutos por questão. */
function runLimit(areas){ return areaNums(areas).length*4; }
function synthRun(ex){ const e=EX[ex]; if(!e.his) return null; return {id:'papel',areas:FULL_AREAS,mode:'prova',ans:Object.assign({},e.his),flag:{},cut:{},start:Date.parse('2026-09-20T12:00:00-03:00'),done:true,end:Date.parse('2026-09-21T12:00:00-03:00'),time:null,papel:true}; }
function runReal(r){ if(!r||!r.done) return false; if(r.papel) return true; const n=areaNums(r.areas).length; return Object.keys(r.ans||{}).length>=Math.ceil(n*0.6); }
function allRuns(ex){ const st=pvState(ex); const r=st.runs.slice(); const s=synthRun(ex); if(s) r.unshift(s); return r; }
function scoreRun(ex,run){
  const e=EX[ex], res={total:0,ok:0,blank:0,anul:0,areas:{},wrong:[],flagWrong:0,flagOk:0,thirds:[[0,0],[0,0],[0,0]]};
  const nums=areaNums(run.areas);
  run.areas.split('').forEach(a=>res.areas[a]={n:0,ok:0,blank:0});
  nums.forEach((n,i)=>{ const k=e.key[n]; const a=Object.keys(AREAS).find(x=>n>=AREAS[x].a&&n<=AREAS[x].b); const r=res.areas[a];
    if(k==null){ res.anul++; return; }
    r.n++; res.total++; const g=run.ans[n]; const th=Math.min(2,Math.floor(((n-AREAS[a].a)/45)*3)); res.thirds[th][1]++;
    if(!g){ r.blank++; res.blank++; res.wrong.push(n); return; }
    if(g===k){ r.ok++; res.ok++; res.thirds[th][0]++; if(run.flag&&run.flag[n]) res.flagOk++; }
    else { res.wrong.push(n); if(run.flag&&run.flag[n]) res.flagWrong++; }
  });
  return res;
}

  <div class="sec-title"><h2>Cartão corrigido</h2><span class="eyebrow">toque para ver a questão</span></div>
  <div class="panel">${cardGrid(id,run,areaNums(run.areas)).replace('cartão-resposta','')}</div>
  <div class="sec-title"><h2>Revisão</h2><div class="filters" style="margin:0">${[['erradas','Erradas e em branco'],['duvida','Marcadas como dúvida'],['certas','Certas'],['todas','Todas']].map(([k,l])=>`<button class="chipbtn" data-f="${k}" ${filt===k?'style="background:var(--ink);color:var(--surface)"':''}>${l}</button>`).join('')}</div></div>
  <div id="rvlist"></div>
  <div class="row" style="margin-top:18px"><button class="btn" id="toPv">Voltar às provas</button>${run.papel?'':`<button class="btn" id="delrun">Apagar esta tentativa</button>`}</div>`;
  $('#back').onclick=$('#toPv').onclick=()=>go('provas');
  const rs=$('#runsel'); if(rs) rs.onchange=()=>{ const r=runs[+rs.value]; const i=pvState(id).runs.indexOf(r); go('provares',{id,run:r.id==='papel'?'papel':i,f:filt}); };
  const dlb=$('#delrun'); if(dlb) dlb.onclick=()=>{ if(!dlb.dataset.ok){ dlb.dataset.ok=1; dlb.textContent='Toque de novo para apagar'; return; } const ix=pvState(id).runs.indexOf(run); if(ix>=0){ markDel(['pv',id,'runs',run.id],true); pvState(id).runs.splice(ix,1); save(); toast('Tentativa apagada.'); } go('provas'); };
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ param.f=b.dataset.f; vProvaRes(); });
  app.querySelectorAll('[data-go-q]').forEach(b=>b.onclick=()=>{ const n=areaNums(run.areas)[+b.dataset.goQ]; const el=document.getElementById('rv-'+n); if(el){ el.open=true; el.scrollIntoView({behavior:'smooth',block:'start'}); } else { param.f='todas'; vProvaRes(); setTimeout(()=>{ const x=document.getElementById('rv-'+n); if(x){ x.open=true; x.scrollIntoView({block:'start'}); } },60); } });
  const dr=$('#delrun'); if(dr) dr.onclick=()=>{ if(!dr.dataset.c){ dr.dataset.c=1; dr.textContent='Toque de novo para apagar'; return; } const i=st.runs.indexOf(run); if(i>=0){ markDel(['pv',id,'runs',run.id],true); st.runs.splice(i,1); } save(); go('provas'); };
  const box=$('#rvlist');
  if(!list.length){ box.innerHTML='<p class="empty">Nada nesta lista.</p>'; return; }
  list.forEach(n=>{ const g=run.ans[n], k=e.key[n]; const d=document.createElement('details'); d.className='err'; d.id='rv-'+n;
    const status=k==null?'anulada':!g?'em branco':g===k?'certa':'errada';
    d.innerHTML=`<summary><span class="chip" style="background:${status==='certa'?'var(--ok-soft)':status==='anulada'?'var(--sunk)':'var(--bad-soft)'};color:${status==='certa'?'var(--ok)':status==='anulada'?'var(--muted)':'var(--bad)'}">${status}</span><b>Questão ${n}</b><span class="mono muted" style="font-size:12px">sua: ${g||'—'} · gabarito: ${k||'anulada'}</span>${run.flag&&run.flag[n]?'<span class="mono" style="font-size:11px;color:var(--warn)">dúvida</span>':''}${st.notes[n]?'<span class="done-mark">● regra escrita</span>':''}</summary><div class="inner"></div>`;
    box.appendChild(d);
    d.addEventListener('toggle',()=>{ if(!d.open||d.dataset.ok) return; d.dataset.ok=1; const sh=Object.entries(e.shared||{}).find(([kk])=>{ const [a,b]=kk.split('-').map(Number); return n>=a&&n<=b; });
      d.querySelector('.inner').innerHTML=`${sh?`<figure class="qimg shared"><img loading="lazy" src="provas/${id}/${sh[1].f}" alt="Texto-base" width="${sh[1].w}" height="${sh[1].h}"></figure>`:''}<figure class="qimg ${e.img[n].w>1000?'wide':''}"><img loading="lazy" src="${imgUrl(id,n)}" alt="Questão ${n}" width="${e.img[n].w}" height="${e.img[n].h}"></figure>
        <div class="bubbles small">${'ABCDE'.split('').map(L=>`<div class="bub"><span class="bL ${L===k?'right':''} ${L===g&&g!==k?'wrong':''}">${L}</span></div>`).join('')}</div>
        <div class="row tutor-only" style="margin-top:10px"><button class="btn gold xp">Explicar com o tutor</button></div><div class="xo"></div>
        <label class="eyebrow" for="pn-${id}-${n}" style="display:block;margin-top:12px">a regra que teria evitado este erro</label><textarea id="pn-${id}-${n}" placeholder="Ex.: em proporção, conferir as unidades antes de multiplicar.">${esc(st.notes[n]||'')}</textarea>`;
      d.querySelector('.xp').onclick=()=>explainOfficial(d.querySelector('.xo'),id,n,g);
      const ta=d.querySelector('textarea'); let tm; ta.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const v=ta.value.trim(); if(v) st.notes[n]=v; else delete st.notes[n]; markDel(['pv',id,'notes',n],!v); save(); },700); });
    });
  });
  const first=box.querySelector('details'); if(first&&filt==='erradas') first.open=true;
}
async function imgBlobs(src){
  const img=new Image(); img.src=src; await img.decode();
  const parts=[]; const W=img.naturalWidth, H=img.naturalHeight; const maxH=Math.round(W*1.6);
  const n=Math.min(3,Math.ceil(H/maxH));
  for(let i=0;i<n;i++){ const y0=Math.max(0,Math.round(i*H/n)-30), y1=Math.min(H,Math.round((i+1)*H/n)+30);
    const c=document.createElement('canvas'); c.width=W; c.height=y1-y0; const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,W,c.height); cx.drawImage(img,0,y0,W,y1-y0,0,0,W,y1-y0);
    parts.push(await new Promise(r=>c.toBlob(r,'image/png'))); }
  return parts;
}
function officialPrompt(id,n,his,sh){ const e=EX[id], k=e.key[n]; return `Você é um professor de cursinho preparando o estudante para a prova da Transpetro (Cesgranrio, nível médio, Manutenção – Elétrica), em português do Brasil, texto simples sem markdown. As imagens são, em ordem, ${sh?'o texto-base compartilhado e ':''}a questão ${n} da ${e.title}, recortada do caderno oficial, possivelmente em mais de uma parte. Gabarito oficial: ${k==null?'questão anulada pela banca':k}. ${his?`Ele marcou ${his}.`:'Ele deixou em branco.'}
Faça: 1) Em uma linha, o que a questão pede e qual item do edital ela cobra. 2) A resolução passo a passo até chegar ao gabarito, com as contas conferidas, se houver. 3) ${his&&his!==k?`Por que a ${his} está errada e qual raciocínio provavelmente levou a ela.`:'Qual alternativa é o distrator mais perigoso e por quê.'} 4) Uma regra curta para não errar de novo. Se alguma parte da imagem estiver ilegível, diga isso em vez de inventar. Máximo de 280 palavras.`; }
async function explainOfficial(out,id,n,his){
  if(!sample){ out.innerHTML='<p class="empty">O tutor não está disponível nesta visualização.</p>'; return; }
  const e=EX[id], k=e.key[n];
  out.innerHTML='<div class="tutor-out">Lendo a questão…</div>'; const box=out.firstChild;
  try{
    const lim=await sample.limits().catch(()=>null);
    if(!lim||!lim.images){ box.textContent='Esta visualização não permite enviar imagens ao tutor. Copie o número da questão e peça a explicação no chat do projeto.'; return; }
    let blobs=await imgBlobs(imgUrl(id,n)); const sh=Object.entries(e.shared||{}).find(([kk])=>{ const [a,b]=kk.split('-').map(Number); return n>=a&&n<=b; });
    if(sh) blobs=(await imgBlobs(`provas/${id}/${sh[1].f}`)).concat(blobs);
    blobs=blobs.slice(0,lim.images.maxCount||3);
    const prompt=officialPrompt(id,n,his,sh);
    const r=await sample(prompt,{images:blobs,modelTier:'complex',cache:false,onText:({text})=>{box.textContent=text;}}); box.textContent=r.text;
  }catch(err){ box.textContent= err&&err.code==='not_granted'?'Você não autorizou o tutor nesta página. Libere no menu de permissões do artefato.': err&&err.code==='rate_limited'?'Muitas perguntas seguidas. Espere um minuto.': (err&&err.text)||'Não consegui explicar agora. Tente de novo em instantes.'; }
}
document.addEventListener('keydown',e=>{
  if(view!=='prova') return; const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
  const k=e.key; if(/^[a-eA-E]$/.test(k)){ const b=app.querySelector(`.bL[data-L="${k.toUpperCase()}"]:not(:disabled)`); if(b){ e.preventDefault(); b.click(); } }
  else if(k==='ArrowRight'){ const b=$('#pvnext'); if(b&&!b.disabled) b.click(); } else if(k==='ArrowLeft'){ const b=$('#pvprev'); if(b&&!b.disabled) b.click(); }
  else if(k==='m'||k==='M'){ const b=$('#pvflag'); if(b) b.click(); }
},true);

render();
</script>
